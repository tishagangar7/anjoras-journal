<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#29231d">
  <meta name="description" content="Anjora's Journal — a handmade birthday scrapbook.">
  <title>Anjora's Journal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="desk-noise" aria-hidden="true"></div>

  <main class="stage">
    <section class="sheet bright-sheet active" data-title="cover">
      <div class="bright-canvas">
        <div class="cover-paper cream-a" aria-hidden="true"></div>
        <div class="cover-paper blush-a" aria-hidden="true"></div>
        <div class="cover-paper news-a" aria-hidden="true"></div>
        <div class="cover-paper cream-b" aria-hidden="true"></div>
        <div class="cover-paper blush-b" aria-hidden="true"></div>
        <div class="cover-paper news-b" aria-hidden="true"></div>

        <h1 class="cover-title">Anjora’s<br><span>Journal</span></h1>

        <div class="cover-filmstrip">
          <span class="cover-tape tape-top"></span>
          <figure><img src="assets/photos/IMG_7441.JPG" alt="Anjora holding flowers"></figure>
          <figure><img src="assets/photos/IMG_7446.JPG" alt="Anjora holding flowers"></figure>
          <figure><img src="assets/photos/IMG_7450.JPG" alt="Anjora holding flowers"></figure>
          <span class="cover-tape tape-bottom"></span>
        </div>

        <div class="cut-letters cover-hello" data-cutout="hello gorgeousssssss"></div>
        <div class="pressed-flower flower-left" aria-hidden="true">✿</div>
        <div class="pressed-flower flower-right" aria-hidden="true">❀</div>
        <div class="cover-doodle hearts" aria-hidden="true">♡<br>♡</div>
        <div class="cover-doodle stars" aria-hidden="true">☆　☆</div>
        <button class="open-book dark-ink" data-next aria-label="Turn to the next page">→</button>
      </div>
    </section>

    <section class="sheet dark-sheet" data-title="page 2">
        <div class="dark-canvas">
          <div class="black-paper" aria-hidden="true"></div>
        <div class="newsprint news-one" aria-hidden="true"></div>
        <div class="newsprint news-two" aria-hidden="true"></div>
        <div class="metal-clip" aria-hidden="true"><i></i></div>

        <figure class="torn-print top-left-dark">
          <img src="assets/photos/IMG_2419.JPG" alt="Friends making faces on a night out">
        </figure>
        <div class="torn-print center-dark playable-dark">
          <video controls playsinline preload="metadata" poster="assets/posters/5eed.jpg">
            <source src="assets/videos/5eed6a3095d84972b25b6c0310a9a0db.MP4" type="video/mp4">
          </video>
        </div>
        <figure class="torn-print bottom-left-dark">
          <img src="assets/photos/IMG_1376.JPG" alt="Friends hugging">
        </figure>
        <figure class="torn-print bottom-center-dark">
          <img src="assets/photos/IMG_2905.JPG" alt="Friends in club lighting">
        </figure>
        <figure class="torn-print giant-dark">
          <img src="assets/photos/IMG_2373.JPG" alt="Friends posing together">
        </figure>
        <figure class="torn-print tiny-dark">
          <img src="assets/photos/IMG_8919.JPG" alt="Mirror picture before a night out">
        </figure>
        <div class="torn-print video-dark">
          <video controls playsinline preload="metadata" poster="assets/posters/IMG_8913.jpg">
            <source src="assets/videos/IMG_8913.MP4" type="video/mp4">
          </video>
        </div>

        <div class="flower-fragment" aria-hidden="true"><img src="assets/photos/IMG_0037.JPG" alt=""></div>
      </div>
    </section>
  </main>

  <header class="chrome">
    <button class="monogram" data-go="0" aria-label="Return to cover">AJ</button>
    <div class="progress"><span id="progressBar"></span></div>
    <span id="counter">cover</span>
  </header>

  <nav class="page-nav" aria-label="Journal navigation">
    <button id="prevBtn" aria-label="Previous page">←</button>
    <div id="dots"></div>
    <button id="nextBtn" aria-label="Next page">→</button>
  </nav>
  <script src="script.js"></script>
</body>
</html>
