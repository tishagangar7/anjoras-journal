<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#29231d">
  <meta name="description" content="Anjora's Journal — a handmade birthday scrapbook.">
  <title>Anjora's Journal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="desk-noise" aria-hidden="true"></div>

  <main class="stage">
    <section class="sheet bright-sheet active" data-title="cover">
      <div class="bright-canvas">
        <div class="cover-paper cream-a" aria-hidden="true"></div>
        <div class="cover-paper blush-a" aria-hidden="true"></div>
        <div class="cover-paper news-a" aria-hidden="true"></div>
        <div class="cover-paper cream-b" aria-hidden="true"></div>
        <div class="cover-paper blush-b" aria-hidden="true"></div>
        <div class="cover-paper news-b" aria-hidden="true"></div>

        <h1 class="cover-title">Anjora’s<br><span>Journal</span></h1>

        <div class="cover-filmstrip">
          <span class="cover-tape tape-top"></span>
          <figure><img src="assets/photos/IMG_7441.JPG" alt="Anjora holding flowers"></figure>
          <figure><img src="assets/photos/IMG_7446.JPG" alt="Anjora holding flowers"></figure>
          <figure><img src="assets/photos/IMG_7450.JPG" alt="Anjora holding flowers"></figure>
          <span class="cover-tape tape-bottom"></span>
        </div>

        <div class="cut-letters cover-hello" data-cutout="hello gorgeousssssss"></div>
        <div class="pressed-flower flower-left" aria-hidden="true">✿</div>
        <div class="pressed-flower flower-right" aria-hidden="true">❀</div>
        <div class="cover-doodle hearts" aria-hidden="true">♡<br>♡</div>
        <div class="cover-doodle stars" aria-hidden="true">☆　☆</div>
        <button class="open-book dark-ink" data-next aria-label="Turn to the next page">→</button>
      </div>
    </section>

    <section class="sheet dark-sheet" data-title="page 2">
        <div class="dark-canvas">
          <div class="black-paper" aria-hidden="true"></div>
        <div class="newsprint news-one" aria-hidden="true"></div>
        <div class="newsprint news-two" aria-hidden="true"></div>
        <div class="metal-clip" aria-hidden="true"><i></i></div>

        <figure class="torn-print top-left-dark">
          <img src="assets/photos/IMG_2419.JPG" alt="Friends making faces on a night out">
        </figure>
        <div class="torn-print center-dark playable-dark">
          <video controls playsinline preload="metadata" poster="assets/posters/5eed.jpg">
            <source src="assets/videos/5eed6a3095d84972b25b6c0310a9a0db.MP4" type="video/mp4">
          </video>
        </div>
        <figure class="torn-print bottom-left-dark">
          <img src="assets/photos/IMG_1376.JPG" alt="Friends hugging">
        </figure>
        <figure class="torn-print bottom-center-dark">
          <img src="assets/photos/IMG_2905.JPG" alt="Friends in club lighting">
        </figure>
        <figure class="torn-print giant-dark">
          <img src="assets/photos/IMG_2373.JPG" alt="Friends posing together">
        </figure>
        <figure class="torn-print tiny-dark">
          <img src="assets/photos/IMG_8919.JPG" alt="Mirror picture before a night out">
        </figure>
        <div class="torn-print video-dark">
          <video controls playsinline preload="metadata" poster="assets/posters/IMG_8913.jpg">
            <source src="assets/videos/IMG_8913.MP4" type="video/mp4">
          </video>
        </div>

        <div class="flower-fragment" aria-hidden="true"><img src="assets/photos/IMG_0037.JPG" alt=""></div>
      </div>
    </section>

    <section class="sheet collage-sheet warm-sheet" data-title="page 3">
      <div class="mood-canvas">
        <div class="warm-paper paper-a" aria-hidden="true"></div>
        <div class="warm-paper paper-b" aria-hidden="true"></div>
        <figure class="media m1"><img src="assets/photos/456AB17E-66B1-41C3-8119-AF6D965A0118IMG_2399.JPG" alt="Friends under string lights"></figure>
        <figure class="media m2"><img src="assets/photos/67D9F7DD-F8CE-446B-A6EA-B7894D043D38IMG_2397.JPG" alt="Friends under string lights"></figure>
        <figure class="media m3"><img src="assets/photos/E41E1C0B-1CFD-426C-8247-D6C1331DDA34IMG_2402.JPG" alt="Friends under string lights"></figure>
        <figure class="media m4"><img src="assets/photos/IMG_2090%202.JPG" alt="Two friends under string lights"></figure>
        <figure class="media m5"><img src="assets/photos/DSC01673.JPG" alt="Friends at a restaurant"></figure>
        <figure class="media m6"><img src="assets/photos/DSC01674.JPG" alt="Friends at a restaurant"></figure>
        <figure class="media m7"><img src="assets/photos/IMG_0099.JPG" alt="Friends together"></figure>
      </div>
    </section>

    <section class="sheet collage-sheet sun-sheet" data-title="page 4">
      <div class="mood-canvas">
        <div class="sun-paper paper-a" aria-hidden="true"></div>
        <div class="sun-paper paper-b" aria-hidden="true"></div>
        <figure class="media m1"><img src="assets/photos/DSC01892.JPG" alt="Friends at sunset"></figure>
        <figure class="media m2"><img src="assets/photos/DSC01901.JPG" alt="A group outdoors"></figure>
        <figure class="media m3"><img src="assets/photos/IMG_8623.JPG" alt="Friends at the beach"></figure>
        <figure class="media m4"><img src="assets/photos/IMG_4136.JPG" alt="Friends in golden light"></figure>
        <figure class="media m5"><img src="assets/photos/IMG_4140.JPG" alt="Friends in golden light"></figure>
        <figure class="media m6"><img src="assets/photos/IMG_8792.JPG" alt="Friends wrapped in blankets at the beach"></figure>
      </div>
    </section>

    <section class="sheet collage-sheet road-sheet" data-title="page 5">
      <div class="mood-canvas">
        <div class="road-paper paper-a" aria-hidden="true"></div>
        <div class="road-paper paper-b" aria-hidden="true"></div>
        <figure class="media m1"><img src="assets/photos/IMG_2600.JPG" alt="Friends indoors"></figure>
        <figure class="media m2"><img src="assets/photos/IMG_2631.JPG" alt="Group selfie in sunlight"></figure>
        <figure class="media m3"><img src="assets/photos/IMG_6825.JPG" alt="Two friends smiling"></figure>
        <figure class="media m4"><img src="assets/photos/IMG_6831.JPG" alt="Mirror selfie"></figure>
        <figure class="media m5"><img src="assets/photos/IMG_4341.JPG" alt="Passenger seat candid"></figure>
        <figure class="media m6"><img src="assets/photos/IMG_4342.JPG" alt="Passenger seat candid"></figure>
        <figure class="media m7"><img src="assets/photos/IMG_4347.JPG" alt="Car selfie"></figure>
        <figure class="media m8"><img src="assets/photos/IMG_0715.JPG" alt="Friends in a car"></figure>
        <figure class="media m9"><img src="assets/photos/IMG_0716.JPG" alt="Friends in a car"></figure>
        <div class="media v1 video-media"><video controls playsinline preload="metadata" poster="assets/posters/461.jpg"><source src="assets/videos/461CB173-952A-4752-94EF-1409616293BE.MP4" type="video/mp4"></video></div>
        <div class="media v2 video-media"><video controls playsinline preload="metadata" poster="assets/posters/IMG_2235.jpg"><source src="assets/videos/IMG_2235.MP4" type="video/mp4"></video></div>
      </div>
    </section>

    <section class="sheet collage-sheet chaos-sheet" data-title="page 6">
      <div class="mood-canvas">
        <div class="chaos-paper paper-a" aria-hidden="true"></div>
        <div class="chaos-paper paper-b" aria-hidden="true"></div>
        <figure class="media m1"><img src="assets/photos/IMG_2454.JPG" alt="A screen during a night out"></figure>
        <figure class="media m2"><img src="assets/photos/IMG_2493.JPG" alt="Arcade candid"></figure>
        <figure class="media m3"><img src="assets/photos/IMG_3802.JPG" alt="Funny group selfie"></figure>
        <figure class="media m4"><img src="assets/photos/IMG_9409.JPG" alt="Face-mask candid"></figure>
        <figure class="media m5"><img src="assets/photos/lp_image.JPG" alt="Funny sunglasses moment"></figure>
        <figure class="media m6"><img src="assets/photos/lp_image%202.JPG" alt="Funny sunglasses moment"></figure>
        <figure class="media m7"><img src="assets/photos/lp_image_3.JPG" alt="Webcam candid"></figure>
        <figure class="media m8"><img src="assets/photos/IMG_6006.JPG" alt="Video-call screenshot"></figure>
        <div class="media v1 video-media"><video controls playsinline preload="metadata" poster="assets/posters/IMG_2347.jpg"><source src="assets/videos/IMG_2347.MP4" type="video/mp4"></video></div>
        <div class="media v2 video-media"><video controls playsinline preload="metadata" poster="assets/posters/IMG_8397.jpg"><source src="assets/videos/IMG_8397.MP4" type="video/mp4"></video></div>
      </div>
    </section>

    <section class="sheet collage-sheet soft-sheet" data-title="page 7">
      <div class="mood-canvas">
        <div class="soft-paper paper-a" aria-hidden="true"></div>
        <div class="soft-paper paper-b" aria-hidden="true"></div>
        <figure class="media m1"><img src="assets/photos/IMG_2956.JPG" alt="Friends at home"></figure>
        <figure class="media m2"><img src="assets/photos/IMG_4286.JPG" alt="Friends cuddling"></figure>
        <figure class="media m3"><img src="assets/photos/IMG_8369.JPG" alt="Friends on a couch"></figure>
        <figure class="media m4"><img src="assets/photos/IMG_6223.JPG" alt="Portrait"></figure>
        <figure class="media m5"><img src="assets/photos/IMG_7467.JPG" alt="Mirror selfie with flowers"></figure>
        <figure class="media m6"><img src="assets/photos/IMG_7474.JPG" alt="Candid portrait"></figure>
        <div class="media v1 video-media"><video controls playsinline preload="metadata" poster="assets/posters/IMG_8786.jpg"><source src="assets/videos/IMG_8786.MP4" type="video/mp4"></video></div>
        <div class="media v2 video-media"><video controls playsinline preload="metadata" poster="assets/posters/IMG_4691.jpg"><source src="assets/videos/IMG_4691.MP4" type="video/mp4"></video></div>
      </div>
    </section>

    <section class="sheet collage-sheet snow-sheet" data-title="page 8">
      <div class="mood-canvas">
        <div class="snow-paper paper-a" aria-hidden="true"></div>
        <div class="snow-paper paper-b" aria-hidden="true"></div>
        <figure class="media m1"><img src="assets/photos/IMG_0543.JPG" alt="Applying makeup in ski gear"></figure>
        <figure class="media m2"><img src="assets/photos/IMG_0544.JPG" alt="Applying makeup in ski gear"></figure>
        <div class="media v1 video-media"><video controls playsinline preload="metadata" poster="assets/posters/extra.jpg"><source src="assets/videos/97F23391-AA5B-414A-BDF8-88F69682AFA0.MP4" type="video/mp4"></video></div>
      </div>
    </section>

    <section class="sheet collage-sheet red-sheet" data-title="page 9">
      <div class="mood-canvas">
        <div class="red-paper paper-a" aria-hidden="true"></div>
        <div class="red-paper paper-b" aria-hidden="true"></div>
        <figure class="media m1"><img src="assets/photos/IMG_4733.JPG" alt="Friends in red party lighting"></figure>
        <figure class="media m2"><img src="assets/photos/IMG_4734.JPG" alt="Friends in red party lighting"></figure>
        <figure class="media m3"><img src="assets/photos/IMG_8105.JPG" alt="Friends at night"></figure>
        <div class="media v1 video-media"><video controls playsinline preload="metadata" poster="assets/posters/136e.jpg"><source src="assets/videos/136e5961184c4d5d8f25d6724449257b.MP4" type="video/mp4"></video></div>
        <div class="media v2 video-media"><video controls playsinline preload="metadata" poster="assets/posters/810.jpg"><source src="assets/videos/81051516-CB47-4D0E-A139-DD4183F8974C.MP4" type="video/mp4"></video></div>
      </div>
    </section>

    <section class="sheet birthday-sheet" data-title="birthday">
      <div class="birthday-canvas">
        <div class="birthday-paper birthday-paper-one" aria-hidden="true"></div>
        <div class="birthday-paper birthday-paper-two" aria-hidden="true"></div>

        <figure class="birthday-photo birthday-photo-one">
          <img src="assets/photos/IMG_7441.JPG" alt="Anjora holding flowers">
        </figure>
        <figure class="birthday-photo birthday-photo-two">
          <img src="assets/photos/IMG_2419.JPG" alt="Friends together on a night out">
        </figure>
        <figure class="birthday-photo birthday-photo-three">
          <img src="assets/photos/IMG_4286.JPG" alt="Friends cuddling">
        </figure>

        <div class="cut-letters birthday-heading" data-cutout="happy birthday chud"></div>
        <p class="birthday-message">we love you so much<br><span>come back asap</span></p>

        <img class="birthday-sticker birthday-hearts" src="assets/stickers/double-hearts-doodle.svg" alt="">
        <img class="birthday-sticker birthday-daisy" src="assets/stickers/daisy.svg" alt="">
        <span class="birthday-tape tape-one" aria-hidden="true"></span>
        <span class="birthday-tape tape-two" aria-hidden="true"></span>
      </div>
    </section>
  </main>

  <header class="chrome">
    <button class="monogram" data-go="0" aria-label="Return to cover">AJ</button>
    <div class="progress"><span id="progressBar"></span></div>
    <span id="counter">cover</span>
  </header>

  <nav class="page-nav" aria-label="Journal navigation">
    <button id="prevBtn" aria-label="Previous page">←</button>
    <div id="dots"></div>
    <button id="nextBtn" aria-label="Next page">→</button>
  </nav>
  <script src="script.js"></script>
</body>
</html>
